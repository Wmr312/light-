<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="方案C 端面均光">
  <rect x="1" y="1" width="62" height="62" rx="15" fill="#12313B"/>
  <!-- 出射端面轮廓 -->
  <rect x="15" y="15" width="34" height="34" rx="7" fill="none" stroke="#FFFFFF" stroke-width="2.2" opacity=".5"/>
  <!-- 端面照度均匀分布 -->
  <g fill="#2ED8C6">
    <rect x="22" y="24" width="3.4" height="16" rx="1.7"/>
    <rect x="28" y="24" width="3.4" height="16" rx="1.7"/>
    <rect x="34" y="24" width="3.4" height="16" rx="1.7"/>
    <rect x="40" y="24" width="3.4" height="16" rx="1.7"/>
  </g>
  <!-- 入射光 -->
  <path d="M5 32h8" stroke="#2ED8C6" stroke-width="3" stroke-linecap="round" opacity=".6"/>
</svg>
