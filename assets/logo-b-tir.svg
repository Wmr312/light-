<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="导光柱光迹模拟工具">
  <rect x="1" y="1" width="62" height="62" rx="15" fill="#12313B"/>
  <!-- 导光柱投影 -->
  <rect x="16.2" y="26.6" width="32" height="14" rx="7" fill="#000000" opacity=".22"/>
  <!-- LED 封装：焊盘 -->
  <g fill="#2ED8C6" opacity=".55">
    <rect x="6.2" y="38.0" width="2.6" height="3.0" rx="1"/>
    <rect x="10.0" y="38.0" width="2.6" height="3.0" rx="1"/>
  </g>
  <!-- LED 封装本体 -->
  <rect x="5.0" y="25.4" width="8.6" height="12.8" rx="2.2" fill="#9BF6E8"/>
  <!-- LED 出光透镜（正对入射端面） -->
  <rect x="13.0" y="28.8" width="2.2" height="6.4" rx="1.1" fill="#FFFFFF" opacity=".95"/>
  <!-- 导光柱本体：两端为端面 -->
  <rect x="15.2" y="25" width="32.2" height="14" rx="7" fill="#FFFFFF" opacity=".95"/>
  <!-- 柱内光路：入射端窄、向出射端展开 -->
  <path d="M18.6 29.4L44 27.6V36.4L18.6 34.6z" fill="#2ED8C6" opacity=".16"/>
  <!-- 入射端面 -->
  <rect x="15.6" y="27.2" width="2.6" height="9.6" rx="1.3" fill="#2ED8C6"/>
  <!-- 出射端面 -->
  <rect x="44.0" y="26.2" width="3.4" height="11.6" rx="1.7" fill="#9BF6E8"/>
  <!-- 出射端散射光锥：柔和扩散 -->
  <path d="M47.6 32L58 25V39z" fill="#2ED8C6" opacity=".1"/>
  <!-- 散射光线：五束细线，中心最亮、向外渐弱 -->
  <g stroke-linecap="round" fill="none">
    <path d="M47.6 32L57.6 26.2" stroke="#2ED8C6" stroke-width="1.8" opacity=".45"/>
    <path d="M47.6 32L59 28.9" stroke="#2ED8C6" stroke-width="1.8" opacity=".7"/>
    <path d="M47.6 32H59.8" stroke="#9BF6E8" stroke-width="1.8"/>
    <path d="M47.6 32L59 35.1" stroke="#2ED8C6" stroke-width="1.8" opacity=".7"/>
    <path d="M47.6 32L57.6 37.8" stroke="#2ED8C6" stroke-width="1.8" opacity=".45"/>
  </g>
</svg>
